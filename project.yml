name: HabitMap
options:
  bundleIdPrefix: com.adam
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    DEVELOPMENT_TEAM: DEVTEAM
    SWIFT_VERSION: "5.9"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    SWIFT_STRICT_CONCURRENCY: complete

packages:
  HabitMapCore:
    path: Packages/HabitMapCore
  SnapshotTesting:
    url: https://github.com/pointfreeco/swift-snapshot-testing
    from: 1.17.0

targets:
  HabitMap:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    preBuildScripts:
      - script: |
          if command -v swiftlint &> /dev/null; then
            swiftlint --config "${SRCROOT}/.swiftlint.yml"
          fi
        name: SwiftLint
        shell: /bin/bash
    sources:
      - path: Apps/iOS/HabitMap
        excludes:
          - "**/.DS_Store"
    resources:
      - Apps/iOS/HabitMap/Assets.xcassets
      - Apps/iOS/HabitMap/Resources/Fonts
    info:
      path: Apps/iOS/HabitMap/Info.plist
      properties:
        CFBundleDisplayName: Habit Map
        CFBundleShortVersionString: "0.9"
        CFBundleVersion: "9"
        NSSupportsLiveActivities: true
        UILaunchScreen:
          UIColorName: AccentColor
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIBackgroundModes:
          - fetch
          - processing
        BGTaskSchedulerPermittedIdentifiers:
          - com.adam.habitmap.health-refresh
        UIAppFonts:
          - Fonts/InstrumentSerif-Regular.ttf
          - Fonts/InstrumentSerif-Italic.ttf
          - Fonts/Inter-Regular.ttf
          - Fonts/JetBrainsMono-Regular.ttf
          - Fonts/Silkscreen-Regular.ttf
        NSHealthShareUsageDescription: "Habit Map reads workouts, steps, mindful minutes, sleep, and stand hours to auto-fill habits you've linked to Apple Health. We never store the raw values — only whether your goal was hit."
        NSHealthUpdateUsageDescription: "Not used. Habit Map is read-only for Apple Health."
    entitlements:
      path: Apps/iOS/HabitMap/HabitMap.entitlements
      properties:
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.adam.habitmap
        com.apple.developer.icloud-services:
          - CloudKit
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
        com.apple.security.application-groups:
          - group.com.adam.habitmap
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.adam.habitmap
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIRequiresFullScreen: NO
        TARGETED_DEVICE_FAMILY: "1,2"
    dependencies:
      - package: HabitMapCore
      - target: HabitMapWidgets

  HabitMapCoreTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Packages/HabitMapCore/Tests/HabitMapCoreTests
        excludes:
          - "__Snapshots__"
    dependencies:
      - package: HabitMapCore
      - package: SnapshotTesting
        product: SnapshotTesting
      - target: HabitMap
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        BUNDLE_LOADER: $(TEST_HOST)
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/HabitMap.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/HabitMap

  HabitMapUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - Apps/iOS/HabitMapUITests
    dependencies:
      - target: HabitMap
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: HabitMap

  HabitMapWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Apps/iOS/HabitMapWidgets
        excludes:
          - "**/.DS_Store"
    info:
      path: Apps/iOS/HabitMapWidgets/Info.plist
      properties:
        CFBundleDisplayName: Habit Map
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Apps/iOS/HabitMapWidgets/HabitMapWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.adam.habitmap
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.adam.habitmap.widgets
        INFOPLIST_KEY_CFBundleDisplayName: Habit Map
    dependencies:
      - package: HabitMapCore

schemes:
  HabitMap:
    build:
      targets:
        HabitMap: all
        HabitMapCoreTests: [test]
        HabitMapUITests: [test]
    test:
      targets:
        - HabitMapCoreTests
        - HabitMapUITests
    run:
      config: Debug
    archive:
      config: Release

  # Deterministic logic-only scheme used as the blocking CI gate.
  # HABITMAP_SKIP_SNAPSHOTS=1 makes every SnapshotTestCase subclass skip, so the
  # gate never depends on host-specific pixel rendering. UI tests are excluded
  # (slow + flaky on hosted runners); the full HabitMap scheme covers them.
  HabitMap-CI:
    build:
      targets:
        HabitMap: all
        HabitMapCoreTests: [test]
    test:
      targets:
        - HabitMapCoreTests
      environmentVariables:
        - variable: HABITMAP_SKIP_SNAPSHOTS
          value: "1"
          isEnabled: true
    run:
      config: Debug
