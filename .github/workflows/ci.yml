name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Unit tests (logic gate)
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install tooling
        run: brew install xcodegen xcbeautify

      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/org.swift.swiftpm
          key: spm-${{ runner.os }}-${{ hashFiles('**/Package.resolved', 'project.yml', 'Packages/**/Package.swift') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Generate Xcode project
        run: xcodegen generate

      # Logic-only scheme: HABITMAP_SKIP_SNAPSHOTS=1 skips host-rendered snapshot
      # tests; UI tests are excluded. This is the deterministic green gate, and it
      # also compiles the app (+ widget extension) for the simulator, unsigned.
      - name: Run logic tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project HabitMap.xcodeproj \
            -scheme HabitMap-CI \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            -resultBundlePath TestResults-Unit.xcresult \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            | xcbeautify

      - name: Upload result bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: TestResults-Unit.xcresult
          if-no-files-found: ignore

  lint:
    name: SwiftLint
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install SwiftLint
        run: brew install swiftlint
      # No --strict: warnings annotate but only real errors fail the gate.
      - name: Lint
        run: swiftlint lint --config .swiftlint.yml --reporter github-actions-logging

  snapshot-tests:
    name: Snapshot tests (non-blocking)
    runs-on: macos-15
    timeout-minutes: 60
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install tooling
        run: brew install xcodegen xcbeautify

      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/org.swift.swiftpm
          key: spm-${{ runner.os }}-${{ hashFiles('**/Package.resolved', 'project.yml', 'Packages/**/Package.swift') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Generate Xcode project
        run: xcodegen generate

      # Package tests incl. host-rendered snapshots (HabitMapCoreTests). XCUITests
      # are intentionally NOT run here: GitHub's hosted simulators are unreliable
      # for SwiftUI UI automation + on-disk SwiftData (CoreData errno 2/30 — the
      # very first CI run failed 5/7 UITests before any app changes). UI tests are
      # the local pre-push gate instead (they pass 7/7 against the in-memory store).
      # continue-on-error keeps even an occasional snapshot pixel diff non-gating.
      - name: Run snapshot + package tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project HabitMap.xcodeproj \
            -scheme HabitMap \
            -only-testing:HabitMapCoreTests \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            -resultBundlePath TestResults-Snapshots.xcresult \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            | xcbeautify

      - name: Upload result bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snapshot-test-results
          path: TestResults-Snapshots.xcresult
          if-no-files-found: ignore
